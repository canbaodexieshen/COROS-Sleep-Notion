<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡眠评分热力图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #24292f;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background: #0d1117;
            color: #c9d1d9;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* 控制栏 */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 1px solid #e1e4e8;
            flex-wrap: wrap;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body.dark-mode .controls {
            background: rgba(22, 27, 34, 0.8);
            border-color: #30363d;
        }

        /* 年份选择器 */
        .year-select {
            padding: 6px 12px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background: #ffffff;
            color: #24292f;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        body.dark-mode .year-select {
            background: #161b22;
            color: #c9d1d9;
            border-color: #30363d;
        }

        .year-select:hover {
            border-color: #0969da;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            padding: 6px 12px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background: #ffffff;
            color: #24292f;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        body.dark-mode .theme-toggle {
            background: #161b22;
            color: #c9d1d9;
            border-color: #30363d;
        }

        .theme-toggle:hover {
            border-color: #0969da;
            background: #f6f8fa;
        }

        body.dark-mode .theme-toggle:hover {
            background: #21262d;
        }

        /* 图例 */
        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            font-size: 12px;
            color: #656d76;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 13px;
            height: 13px;
            border-radius: 2px;
        }

        .legend-color.excellent { background: #1ed760; }
        .legend-color.good { background: #ffdd00; }
        .legend-color.poor { background: #fa2f47; }
        .legend-color.empty { background: #E8EAED; }

        body.dark-mode .legend-color.empty { background: #2d333b; }

        /* 热力图容器 */
        .heatmap-container {
            overflow-x: auto;
            padding: 10px 0;
        }

        .heatmap-container svg {
            max-width: 100%;
            height: auto;
        }

        /* 暗黑模式 SVG 滤镜 */
        body.dark-mode .heatmap-container svg {
            filter: invert(0.9) hue-rotate(180deg) brightness(1.1);
        }

        /* 年度热力图链接 */
        .annual-link {
            margin-top: 16px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 1px solid #e1e4e8;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body.dark-mode .annual-link {
            background: rgba(22, 27, 34, 0.8);
            border-color: #30363d;
        }

        .annual-link a {
            color: #0969da;
            text-decoration: none;
            font-size: 14px;
        }

        body.dark-mode .annual-link a {
            color: #58a6ff;
        }

        .annual-link a:hover {
            text-decoration: underline;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #656d76;
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e1e4e8;
            border-top-color: #0969da;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .legend {
                margin-left: 0;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 控制栏 -->
        <div class="controls">
            <!-- 年份选择器 -->
            <select id="year-select" class="year-select">
                <!-- 动态生成 -->
            </select>

            <!-- 主题切换按钮 -->
            <button id="theme-toggle" class="theme-toggle" title="切换主题">
                <span id="theme-icon">🌙</span>
            </button>

            <!-- 图例 -->
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color empty"></div>
                    <span>无数据</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color poor"></div>
                    <span>&lt;60分</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color good"></div>
                    <span>60-85分</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color excellent"></div>
                    <span>&gt;85分</span>
                </div>
            </div>
        </div>

        <!-- 热力图 -->
        <div class="heatmap-container" id="heatmap">
            <div class="loading">
                <div class="loading-spinner"></div>
                <span>加载中...</span>
            </div>
        </div>

        <!-- 年度热力图链接 -->
        <div class="annual-link" id="annual-link" style="display: none;">
            <a id="annual-href" href="#" target="_blank">📊 查看年度热力图</a>
        </div>
    </div>

    <script>
        // 配置
        const CURRENT_YEAR = new Date().getFullYear();
        const HEATMAP_PATHS = {
            current: 'sleep_heatmap/main.svg',
            historical: (year) => `old_heatmap/${year}.svg`
        };

        // 状态
        let isDarkMode = false;
        let currentYear = CURRENT_YEAR;

        // DOM 元素
        const yearSelect = document.getElementById('year-select');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const heatmapContainer = document.getElementById('heatmap');
        const annualLink = document.getElementById('annual-link');
        const annualHref = document.getElementById('annual-href');

        // 初始化年份选择器
        function initYearSelect() {
            // 当前年
            const currentOption = document.createElement('option');
            currentOption.value = CURRENT_YEAR;
            currentOption.textContent = `${CURRENT_YEAR} (今年)`;
            yearSelect.appendChild(currentOption);

            // 历史年份（从 2024 到去年）
            for (let year = CURRENT_YEAR - 1; year >= 2024; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            }
        }

        // 加载热力图
        async function loadHeatmap(year) {
            heatmapContainer.innerHTML = '<div class="loading"><div class="loading-spinner"></div><span>加载中...</span></div>';

            const path = year === CURRENT_YEAR ? HEATMAP_PATHS.current : HEATMAP_PATHS.historical(year);

            try {
                const response = await fetch(path);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const svgText = await response.text();
                heatmapContainer.innerHTML = svgText;

                // 更新年度热力图链接
                if (year < CURRENT_YEAR) {
                    annualLink.style.display = 'block';
                    annualHref.href = `old_heatmap/${year}.svg`;
                    annualHref.textContent = `📊 查看 ${year} 年度热力图`;
                } else {
                    annualLink.style.display = 'none';
                }

            } catch (error) {
                heatmapContainer.innerHTML = `<div class="loading" style="color: #fa2f47;">❌ 加载失败: ${error.message}</div>`;
            }
        }

        // 主题切换
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            themeIcon.textContent = isDarkMode ? '☀️' : '🌙';

            // 保存偏好
            localStorage.setItem('sleep-heatmap-theme', isDarkMode ? 'dark' : 'light');
        }

        // 检测系统主题
        function detectSystemTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedTheme = localStorage.getItem('sleep-heatmap-theme');

            if (savedTheme) {
                isDarkMode = savedTheme === 'dark';
            } else {
                isDarkMode = prefersDark;
            }

            document.body.classList.toggle('dark-mode', isDarkMode);
            themeIcon.textContent = isDarkMode ? '☀️' : '🌙';
        }

        // 检测 Notion 嵌入主题
        function detectNotionTheme() {
            const urlParams = new URLSearchParams(window.location.search);
            const theme = urlParams.get('theme');
            if (theme === 'dark') {
                isDarkMode = true;
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
            }
        }

        // 事件监听
        yearSelect.addEventListener('change', (e) => {
            currentYear = parseInt(e.target.value);
            loadHeatmap(currentYear);
        });

        themeToggle.addEventListener('click', toggleTheme);

        // 监听系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('sleep-heatmap-theme')) {
                isDarkMode = e.matches;
                document.body.classList.toggle('dark-mode', isDarkMode);
                themeIcon.textContent = isDarkMode ? '☀️' : '🌙';
            }
        });

        // 初始化
        detectSystemTheme();
        detectNotionTheme();
        initYearSelect();
        loadHeatmap(CURRENT_YEAR);
    </script>
</body>
</html>
