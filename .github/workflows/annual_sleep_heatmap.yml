name: Archive Annual Sleep Heatmap

on:
  schedule:
    # 每年1月1日北京时间 10:00 运行（UTC 02:00）
    - cron: '0 2 1 1 *'
  workflow_dispatch:
    # 支持手动触发
    inputs:
      manual_year:
        description: '手动指定年份（留空则默认为去年）'
        required: false
        default: ''

jobs:
  archive-heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine target year
        id: year
        run: |
          if [ -n "${{ github.event.inputs.manual_year }}" ]; then
            echo "target_year=${{ github.event.inputs.manual_year }}" >> $GITHUB_OUTPUT
          else
            echo "target_year=$(( $(date +%Y) - 1 ))" >> $GITHUB_OUTPUT
          fi

      - name: Archive annual heatmap
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TARGET_YEAR: ${{ steps.year.outputs.target_year }}
        run: python archive_heatmap.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add old_heatmap/
          git diff --staged --quiet || git commit -m "Archive ${{ steps.year.outputs.target_year }} sleep heatmap [skip ci]"
          git push
